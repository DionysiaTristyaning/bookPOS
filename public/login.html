<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BookPOS</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(130% 130% at 50% 10%, #1e293b 0%, #0b0f19 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 36px 30px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 14px;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      font-size: 15px;
      color: #64748b;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 11px 14px 11px 38px;
      font-size: 14px;
      color: #f8fafc;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: #0f172a;
    }

    .form-input::placeholder {
      color: #64748b;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    #msg {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      border-radius: 8px;
      display: none;
    }

    #msg.show-error {
      display: block;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
    }

    #msg.show-success {
      display: block;
      background: rgba(22, 163, 74, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      padding: 10px 14px;
    }

    .db-status-bar {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .db-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
    }

    .db-dot.online { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
    .db-dot.offline { background: #ef4444; }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="brand-header">
      <div class="brand-badge">📚</div>
      <h1 class="brand-title">BookPOS</h1>
      <p class="brand-sub">Sistem Kasir &amp; Manajemen Toko Buku</p>
    </div>

    <form id="f">
      <div class="form-group">
        <label class="form-label" for="u">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input class="form-input" id="u" placeholder="Username" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="p">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input class="form-input" id="p" type="password" placeholder="Password" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" id="submit_btn" class="btn-submit">
        <span>Masuk</span>
      </button>

      <div id="msg"></div>
    </form>

    <div class="db-status-bar" id="db_status_container">
      <span class="db-dot" id="db_dot"></span>
      <span id="db_status_text">Memeriksa koneksi MongoDB Atlas...</span>
    </div>
  </div>

  <script>
    // 1. Cek jika sudah login sebelumnya
    const token = localStorage.getItem("token");
    if (token) {
      let user;
      try { user = JSON.parse(localStorage.getItem("user")); } catch {}
      location.replace(user?.role === "admin" ? "/master.html" : "/");
    }

    // Cek status database live
    async function checkDbHealth() {
      const dot = document.getElementById("db_dot");
      const text = document.getElementById("db_status_text");
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (data.database_connected) {
          dot.className = "db-dot online";
          text.textContent = "MongoDB Atlas Online (" + (data.database_name || "bookpos") + ")";
        } else {
          dot.className = "db-dot offline";
          text.textContent = "MongoDB Atlas Terputus";
        }
      } catch (e) {
        dot.className = "db-dot offline";
        text.textContent = "Menghubungkan ke server...";
      }
    }
    checkDbHealth();

    // 2. Handler Login Submit
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = document.getElementById("submit_btn");
      msg.textContent = "";
      msg.className = "";
      msg.style.display = "none";
      btn.disabled = true;
      btn.innerHTML = '<span>Memverifikasi...</span>';

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("u").value.trim(),
            password: document.getElementById("p").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || "Login gagal. Periksa username dan password.";
          msg.className = "show-error";
          btn.disabled = false;
          btn.innerHTML = '<span>Masuk</span>';
          return;
        }

        msg.textContent = "Login berhasil! Mengalihkan...";
        msg.className = "show-success";
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        setTimeout(() => {
          location.replace(data.user.role === "admin" ? "/master.html" : "/");
        }, 400);
      } catch (err) {
        msg.textContent = "Tidak bisa menghubungi server API. Pastikan server aktif.";
        msg.className = "show-error";
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk</span>';
      }
    });
  </script>
</body>
</html>
