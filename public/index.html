<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir POS - BookPOS</title>
  <script src="/auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.min.css">
  <script src="https://cdn.webix.com/edge/webix.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
  // State
  let currentCart = [];
  let allBooks = [];
  let categoriesList = [];
  let currentUser = Auth.user || { username: "", nama: "", role: "" };
  let tarifPajak = 0;

  function cartSubtotal() { return currentCart.reduce((s,i) => s + i.subtotal, 0); }
  function cartPajak()    { return Math.round(cartSubtotal() * tarifPajak); }
  function cartTotal()    { return cartSubtotal() + cartPajak(); }

  function formatRupiah(n) { return "Rp\u00a0" + (parseInt(n)||0).toLocaleString("id-ID"); }
  function cleanISBN(s)    { return String(s||"").replace(/[^0-9X]/gi,"").toUpperCase(); }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = "sine"; osc.frequency.value = 880;
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start(); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
  }

  async function apiCall(endpoint, method="GET", body=null) {
    const hdrs = { "Content-Type": "application/json" };
    const token = localStorage.getItem("token");
    if (token) hdrs["Authorization"] = "Bearer " + token;
    const opts = { method, headers: hdrs };
    if (body) opts.body = JSON.stringify(body);
    const res  = await fetch("/api" + endpoint, opts);
    const data = await res.json();
    if (res.status === 401) Auth.logout();
    if (!res.ok) throw new Error(data.error || "Gagal (" + res.status + ")");
    return data;
  }

  async function loadConfig() {
    try { const c = await apiCall("/config"); tarifPajak = Number(c.tarif_pajak)||0; } catch(e) {}
    renderCart();
  }

  async function checkHealth() {
    try {
      const h = await apiCall("/health");
      const el = document.getElementById("db_status_pill");
      if (el) el.innerHTML = h.database_connected
        ? '<span class="status-pill status-online">🟢 Atlas Online</span>'
        : '<span class="status-pill status-offline">⚠️ DB Terputus</span>';
    } catch(e) {
      const el = document.getElementById("db_status_pill");
      if (el) el.innerHTML = '<span class="status-pill status-offline">⚠️ Offline</span>';
    }
  }

  async function loadCategories() {
    try {
      categoriesList = await apiCall("/categories");
      const f = $$("category_filter");
      if (f) {
        f.define("options", [{ id:"all", value:"Semua Kategori" }, ...categoriesList.map(c=>({id:c.id,value:c.nama}))]);
        f.refresh();
      }
    } catch(e) {}
  }

  async function loadCatalog() {
    try {
      const search = $$("search_input") ? $$("search_input").getValue().trim() : "";
      const catId  = $$("category_filter") ? $$("category_filter").getValue() : "all";
      let url = "/books?status=aktif";
      if (search) url += "&search=" + encodeURIComponent(search);
      if (catId && catId !== "all") url += "&kategori_id=" + encodeURIComponent(catId);
      allBooks = await apiCall(url);
      const t = $$("catalog_table");
      if (t) { t.clearAll(); t.parse(allBooks); }
    } catch(err) {
      webix.message({ type:"error", text:"Gagal memuat katalog: " + err.message });
    }
  }

  function addToCart(book) {
    if (!book || book.stok <= 0) { webix.message({ type:"error", text:"Stok habis!" }); return; }
    const ex = currentCart.find(i => i.id === book.id);
    if (ex) {
      if (ex.qty >= book.stok) { webix.message({ type:"error", text:"Stok maks: " + book.stok }); return; }
      ex.qty++; ex.subtotal = ex.qty * ex.harga_jual;
    } else {
      currentCart.push({ id:book.id, isbn:book.isbn, judul:book.judul, penulis:book.penulis,
        harga_jual:parseInt(book.harga_jual)||0, stok:book.stok, qty:1, subtotal:parseInt(book.harga_jual)||0 });
    }
    playBeep(); renderCart();
    webix.message({ type:"success", text:'+ "' + book.judul.substring(0,28) + '"' });
  }

  function updateCartQty(bookId, delta) {
    const idx = currentCart.findIndex(i => i.id === bookId);
    if (idx === -1) return;
    const item = currentCart[idx];
    const nq = item.qty + delta;
    if (nq <= 0) { currentCart.splice(idx, 1); }
    else {
      const bk = allBooks.find(b => b.id === bookId);
      const mx = bk ? bk.stok : item.stok;
      if (nq > mx) { webix.message({ type:"error", text:"Stok maks: " + mx }); return; }
      item.qty = nq; item.subtotal = nq * item.harga_jual;
    }
    renderCart();
  }

  function removeCartItem(id) { currentCart = currentCart.filter(i => i.id !== id); renderCart(); }

  function clearCart() {
    currentCart = []; renderCart();
    if ($$("cash_input")) $$("cash_input").setValue("");
    updateChangeDue();
  }

  function renderCart() {
    const t = $$("cart_table");
    if (t) { t.clearAll(); t.parse(currentCart); }

    const subtotal = cartSubtotal(), pajak = cartPajak(), total = subtotal + pajak;
    const items = currentCart.reduce((s,i) => s+i.qty, 0);

    if ($$("total_display")) {
      const detail = tarifPajak > 0
        ? 'Sub ' + formatRupiah(subtotal) + ' + Pajak ' + formatRupiah(pajak)
        : (items > 0 ? items + ' jenis buku' : 'Keranjang kosong');
      $$("total_display").setHTML(
        '<div class="total-due-box">' +
        '<div class="total-due-label">TOTAL TAGIHAN</div>' +
        '<div class="total-due-amount">' + formatRupiah(total) + '</div>' +
        '<div class="total-due-detail">' + detail + '</div>' +
        '</div>'
      );
    }
    if ($$("cart_header_label")) $$("cart_header_label").setValue("🛒 Keranjang (" + items + " item)");
    updateChangeDue();
  }

  function getCleanCash() {
    const s = String($$("cash_input") ? $$("cash_input").getValue() : "").replace(/[^0-9]/g,"");
    return { raw:s, val:parseInt(s,10)||0 };
  }

  function updateChangeDue() {
    const total  = cartTotal();
    const method = $$("payment_method") ? $$("payment_method").getValue() : "tunai";
    const lbl    = $$("change_due_label");
    if (!lbl) return;
    const { raw, val } = getCleanCash();

    if (method !== "tunai") {
      if (raw && val < total) {
        lbl.setHTML('<div class="change-box change-short"><span>Kurang Bayar:</span><b>' + formatRupiah(total - val) + '</b></div>');
      } else {
        lbl.setHTML('<div class="change-box"><span>Jumlah Tagihan:</span><b>' + formatRupiah(total) + '</b></div>');
      }
      return;
    }
    const diff = val - total;
    if (diff >= 0) {
      lbl.setHTML('<div class="change-box change-ok"><span>Kembalian:</span><b>' + formatRupiah(diff) + '</b></div>');
    } else if (val === 0 && total === 0) {
      lbl.setHTML('<div class="change-box"><span>Status Kembalian:</span><b>Rp 0</b></div>');
    } else {
      lbl.setHTML('<div class="change-box change-short"><span>Kurang Bayar:</span><b>' + formatRupiah(Math.abs(diff)) + '</b></div>');
    }
  }

  function setQuickCash(amount) {
    const total = cartTotal();
    if ($$("cash_input")) $$("cash_input").setValue(amount === "pas" ? (total > 0 ? String(total) : "") : String(amount));
    updateChangeDue();
  }

  async function processCheckout() {
    if (!currentCart.length) { webix.message({ type:"error", text:"Keranjang kosong!" }); return; }
    const total    = cartTotal();
    const method   = $$("payment_method") ? $$("payment_method").getValue() : "tunai";
    const { raw, val } = getCleanCash();
    let cashReceived = total;

    if (method === "tunai") {
      if (!raw || val < total) {
        webix.message({ type:"error", text:"Uang tunai kurang! Tagihan: " + formatRupiah(total) });
        if ($$("cash_input")) $$("cash_input").focus();
        return;
      }
      cashReceived = val;
    } else {
      if (raw && val < total) {
        webix.message({ type:"error", text:"Nominal " + method.toUpperCase() + " kurang dari tagihan " + formatRupiah(total) + "!" });
        if ($$("cash_input")) $$("cash_input").focus();
        return;
      }
    }

    try {
      webix.extend($$("main_layout"), webix.ProgressBar);
      $$("main_layout").showProgress({ type:"icon" });
      const res = await apiCall("/checkout", "POST", {
        items: currentCart.map(i => ({ id:i.id, isbn:i.isbn, judul:i.judul, qty:i.qty })),
        metode_pembayaran: method, tunai_diterima: cashReceived, kasir_nama: currentUser.nama
      });
      $$("main_layout").hideProgress();
      showReceiptModal(res.transaction);
      clearCart(); await loadCatalog();
    } catch(err) {
      $$("main_layout").hideProgress();
      webix.message({ type:"error", text:"Transaksi gagal: " + err.message });
    }
  }

  function showReceiptModal(tx) {
    const itemsHtml = (tx.items||[]).map(i =>
      '<div class="receipt-row">' +
      '<div style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + i.judul + '</div>' +
      '<div>' + i.qty + 'x</div>' +
      '<div style="font-weight:700;">' + formatRupiah(i.subtotal) + '</div>' +
      '</div>'
    ).join("");
    const html =
      '<div class="receipt-paper" id="printable_receipt">' +
      '<div class="receipt-header"><div class="receipt-store-name">📚 BOOKPOS</div>' +
      '<div class="receipt-sub">Toko Buku & Literatur</div></div>' +
      '<div class="receipt-divider"></div>' +
      '<div class="receipt-row"><span>No. Faktur</span><span style="font-weight:700;">' + tx.no_faktur + '</span></div>' +
      '<div class="receipt-row"><span>Waktu</span><span>' + new Date(tx.created_at).toLocaleString("id-ID") + '</span></div>' +
      '<div class="receipt-row"><span>Kasir</span><span>' + (tx.kasir_nama||"Kasir") + '</span></div>' +
      '<div class="receipt-row"><span>Metode</span><span style="text-transform:uppercase;font-weight:700;">' + tx.metode_pembayaran + '</span></div>' +
      '<div class="receipt-divider"></div>' + itemsHtml +
      (tx.pajak > 0
        ? '<div class="receipt-row"><span>Subtotal</span><span>' + formatRupiah(tx.subtotal) + '</span></div>' +
          '<div class="receipt-row"><span>Pajak</span><span>' + formatRupiah(tx.pajak) + '</span></div>'
        : '') +
      '<div class="receipt-total-row"><span>TOTAL</span><span>' + formatRupiah(tx.total) + '</span></div>' +
      (tx.metode_pembayaran === "tunai"
        ? '<div class="receipt-row" style="margin-top:4px;"><span>Tunai</span><span>' + formatRupiah(tx.tunai_diterima) + '</span></div>' +
          '<div class="receipt-row"><span>Kembalian</span><span style="font-weight:700;color:#16a34a;">' + formatRupiah(tx.kembalian) + '</span></div>'
        : '') +
      '<div class="receipt-divider"></div>' +
      '<div class="receipt-footer"><div>Terima kasih telah berbelanja!</div>' +
      '<div style="margin-top:8px;letter-spacing:3px;font-weight:700;">*' + tx.no_faktur + '*</div></div>' +
      '</div>';

    if ($$("receipt_window")) $$("receipt_window").destructor();
    webix.ui({
      view:"window", id:"receipt_window", modal:true, position:"center", width:370,
      head:{ view:"toolbar", cols:[
        { view:"label", label:"🧾 Struk Pembayaran" },
        { view:"icon", icon:"wxi-close", click:()=>$$("receipt_window").close() }
      ]},
      body:{ rows:[
        { template:html, autoheight:true, scroll:"y", maxHeight:500 },
        { view:"toolbar", css:"no-print", padding:8, cols:[
          { view:"button", value:"🖨️ Cetak Struk", css:"webix_primary", click:()=>window.print() },
          { view:"button", value:"➕ Transaksi Baru", click:()=>$$("receipt_window").close() }
        ]}
      ]}
    }).show();
  }

  async function showSalesHistory() {
    try {
      const txs = await apiCall("/transactions?limit=30");
      if ($$("history_window")) $$("history_window").destructor();
      webix.ui({
        view:"window", id:"history_window", modal:true, position:"center", width:840, height:480,
        head:{ view:"toolbar", cols:[
          { view:"label", label:"📜 Riwayat Penjualan / Faktur" },
          { view:"icon", icon:"wxi-close", click:()=>$$("history_window").close() }
        ]},
        body:{ rows:[{ view:"datatable", id:"history_table", data:txs, select:"row", rowHeight:40,
          columns:[
            { id:"no_faktur", header:"No. Faktur", width:210, template:o=>'<span style="font-weight:600;font-size:12px;color:#0f172a;">'+o.no_faktur+'</span>' },
            { id:"created_at", header:"Waktu", width:160, template:o=>'<span style="font-size:12px;color:#475569;">'+new Date(o.created_at).toLocaleString("id-ID")+'</span>' },
            { id:"items", header:"Item", width:80, template:o=>'<span style="font-size:12px;color:#334155;">'+(o.items||[]).length+' judul</span>' },
            { id:"metode_pembayaran", header:"Metode", width:95, template:o=>'<span class="category-tag">'+o.metode_pembayaran.toUpperCase()+'</span>' },
            { id:"total", header:"Total", width:130, template:o=>'<span style="font-weight:700;font-size:13px;color:#0f172a;">'+formatRupiah(o.total)+'</span>' },
            { id:"act", header:"", width:85, template:()=>'<span class="action-btn" style="color:#2563eb;font-weight:600;font-size:12px;">Lihat ↗</span>' }
          ],
          on:{ onItemClick(id) { const r=this.getItem(id); if(r){$$("history_window").close(); showReceiptModal(r);} } }
        }]}
      }).show();
    } catch(err) {
      webix.message({ type:"error", text:"Gagal memuat riwayat: " + err.message });
    }
  }

  function startLiveClock() {
    const update = () => {
      const el = document.getElementById("live_clock");
      if (el) {
        const now = new Date();
        const tgl = now.toLocaleDateString("id-ID", { weekday:"short", day:"numeric", month:"short" });
        const jam = now.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
        el.textContent = "🕒 " + tgl + " " + jam;
      }
    };
    update(); setInterval(update, 1000);
  }

  // ===================== WEBIX UI =====================
  webix.ready(function () {
    webix.ui.fullScreen();
    webix.ui({
      id: "main_layout",
      cols: [
        // ── SIDEBAR ──
        {
          width: 220,
          view: "template",
          borderless: true,
          css: "pos-sidebar-container",
          template: function() {
            const init = (currentUser.nama||"K").charAt(0).toUpperCase();
            const isAdmin = currentUser.role === "admin";
            return `
<div class="sidebar-inner">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon">📚</div>
    <div>
      <div class="sidebar-brand-name">BookPOS</div>
      <div class="sidebar-brand-sub">Point of Sale</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label-section">Menu</div>
    <a href="/" class="sidebar-link active">
      <span class="nav-icon">🛒</span>
      <span class="nav-text">Kasir / POS</span>
    </a>
    ${isAdmin ? `
    <a href="/master.html" class="sidebar-link">
      <span class="nav-icon">📦</span>
      <span class="nav-text">Master Data</span>
    </a>
    <a href="/laporan.html" class="sidebar-link">
      <span class="nav-icon">📊</span>
      <span class="nav-text">Laporan</span>
    </a>` : ""}
    <button onclick="showSalesHistory()" class="sidebar-link" style="border:none;width:100%;text-align:left;cursor:pointer;">
      <span class="nav-icon">📜</span>
      <span class="nav-text">Riwayat Nota</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-avatar">${init}</div>
      <div class="user-info">
        <div class="user-name">${currentUser.nama||"Kasir"}</div>
        <div class="user-role">${(currentUser.role||"kasir").toUpperCase()}</div>
      </div>
      <button class="btn-logout" onclick="Auth.logout()">Keluar</button>
    </div>
    <div class="sidebar-meta">
      <div id="live_clock" class="sidebar-clock">🕒 --:--</div>
      <div id="db_status_pill"><span class="status-pill status-offline">Memeriksa...</span></div>
    </div>
  </div>
</div>`;
          }
        },

        // ── MAIN WORKSPACE ──
        {
          rows: [
            // Top bar — NO keyboard hints
            {
              view: "toolbar", height: 48, css: "pos-topbar",
              cols: [
                { view:"label", label:'<span style="font-size:14px;font-weight:700;color:#111;">🛒 Kasir &amp; Point of Sale</span>', autowidth:true },
                {},
                { view:"button", value:"🔄 Segarkan", autowidth:true, css:"secondary-toolbar-btn", click:()=>loadCatalog() }
              ]
            },

            // POS Body: Catalog left + Cart right — full height, no empty white space
            {
              gravity: 1,
              cols: [
                // LEFT: Catalog (full height)
                {
                  gravity: 1,
                  rows: [
                    {
                      view:"toolbar", padding:8,
                      cols:[
                        { view:"text", id:"search_input", placeholder:"🔍 Scan Barcode / cari Judul / Penulis...",
                          on:{ onEnter() {
                            const v = this.getValue().trim(), c = cleanISBN(v);
                            const ex = allBooks.find(b=>b.isbn===c||cleanISBN(b.isbn)===c);
                            if (ex) { addToCart(ex); this.setValue(""); } else loadCatalog();
                          }}
                        },
                        { width:6 },
                        { view:"select", id:"category_filter", width:155,
                          options:[{id:"all",value:"Semua Kategori"}],
                          on:{onChange:()=>loadCatalog()} },
                        { width:6 },
                        { view:"button", value:"Cari", width:65, css:"webix_primary", click:()=>loadCatalog() },
                        { view:"button", value:"Reset", width:60, click(){
                          $$("search_input").setValue(""); $$("category_filter").setValue("all"); loadCatalog();
                        }}
                      ]
                    },
                    {
                      view:"datatable", id:"catalog_table", select:"row", rowHeight:46,
                      gravity: 1,
                      scroll:"y",
                      columns:[
                        { id:"isbn", header:"ISBN", width:130, template:o=>'<span class="isbn-text">'+o.isbn+'</span>' },
                        { id:"judul", header:"Judul & Penulis", fillspace:true,
                          template:o=>'<div style="line-height:1.3;padding:3px 0;">' +
                            '<div style="font-weight:700;color:#111;font-size:13px;">'+o.judul+'</div>' +
                            '<div style="font-size:11px;color:#6b7280;">'+o.penulis+(o.penerbit?' · '+o.penerbit:'')+'</div></div>' },
                        { id:"kategori_nama", header:"Kategori", width:105, template:o=>'<span class="category-tag">'+(o.kategori_nama||"-")+'</span>' },
                        { id:"harga_jual", header:"Harga", width:105, template:o=>'<span class="price-text">'+formatRupiah(o.harga_jual)+'</span>' },
                        { id:"stok", header:"Stok", width:65,
                          template:o=>{
                            if(o.stok<=0) return '<span class="stock-badge stock-out">Habis</span>';
                            if(o.stok<=5) return '<span class="stock-badge stock-low">'+o.stok+'</span>';
                            return '<span class="stock-badge stock-in">'+o.stok+'</span>';
                          }
                        },
                        { id:"act", header:"", width:105,
                          template:o=>o.stok<=0
                            ? '<div style="display:flex;align-items:center;justify-content:center;height:100%;"><button disabled class="action-btn stock-out-btn">Habis</button></div>'
                            : '<div style="display:flex;align-items:center;justify-content:center;height:100%;"><button class="action-btn add-cart">+ Tambah</button></div>'
                        }
                      ],
                      onClick:{ "add-cart"(e,id){ addToCart(this.getItem(id)); return false; } },
                      on:{ onItemDblClick(id){ addToCart(this.getItem(id)); } }
                    }
                  ]
                },

                // RIGHT: Cart + Payment — full height with comfortably raised pay button
                {
                  width: 420,
                  borderless: false,
                  rows: [
                    // Cart header
                    {
                      view:"toolbar", height:40,
                      cols:[
                        { id:"cart_header_label", view:"label", label:"🛒 Keranjang (0 item)",
                          autowidth:true, css:"cart-header-title" },
                        {},
                        { view:"button", value:"Kosongkan", width:90, css:"webix_danger", click:clearCart }
                      ]
                    },
                    // Cart items (flexible gravity: 1 to fill available vertical space)
                    {
                      view:"datatable", id:"cart_table", gravity:1, minHeight:120, rowHeight:38,
                      scroll:"y",
                      columns:[
                        { id:"judul", header:"Buku", fillspace:true,
                          template:o=>'<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:38px;">'+o.judul+'</div>' },
                        { id:"qty", header:"Qty", width:85,
                          template:o=>'<div style="display:flex;align-items:center;justify-content:center;gap:2px;height:38px;">' +
                            '<button class="action-btn qty-minus" style="padding:1px 6px;border:1px solid #e2e8f0;border-radius:3px;">−</button>' +
                            '<span style="font-weight:700;width:20px;text-align:center;font-size:12px;">'+o.qty+'</span>' +
                            '<button class="action-btn qty-plus" style="padding:1px 6px;border:1px solid #e2e8f0;border-radius:3px;">+</button></div>' },
                        { id:"subtotal", header:"Subtotal", width:100,
                          template:o=>'<span style="font-size:12px;font-weight:700;display:block;text-align:right;line-height:38px;">'+formatRupiah(o.subtotal)+'</span>' },
                        { id:"del", header:"", width:28, template:()=>'<span class="action-btn del" title="Hapus" style="color:#dc2626;font-size:13px;line-height:38px;display:block;text-align:center;">✕</span>' }
                      ],
                      onClick:{
                        "qty-minus"(e,id){ updateCartQty(id.row,-1); return false; },
                        "qty-plus"(e,id) { updateCartQty(id.row,1);  return false; },
                        "del"(e,id)      { removeCartItem(id.row);   return false; }
                      }
                    },
                    // Total display
                    { id:"total_display", view:"template", height:72, borderless:true,
                      template:'<div class="total-due-box"><div class="total-due-label">TOTAL TAGIHAN</div><div class="total-due-amount">Rp\u00a00</div><div class="total-due-detail">Keranjang kosong</div></div>' },
                    // Payment form — comfortably positioned, pay button raised nicely above bottom edge
                    {
                      view:"form", id:"payment_form", padding:{top:4,right:10,bottom:8,left:10},
                      elements:[
                        // Payment method selector
                        {
                          view:"segmented", id:"payment_method", value:"tunai", height:32,
                          options:[
                            { id:"tunai", value:"💵 Tunai" },
                            { id:"kartu", value:"💳 Kartu" },
                            { id:"qris",  value:"📱 QRIS" }
                          ],
                          on:{ onChange(v) {
                            if (v !== "tunai" && $$("cash_input")) {
                              const t = cartTotal();
                              if (t > 0) $$("cash_input").setValue(String(t));
                            }
                            updateChangeDue();
                          }}
                        },
                        // Cash input — inline label, 34px height
                        { view:"text", id:"cash_input",
                          label:"Bayar (Rp):",
                          labelWidth:85,
                          height:34,
                          placeholder:"0",
                          keyPressTimeout:80,
                          on:{
                            onTimedKeyPress:()=>updateChangeDue(),
                            onEnter:()=>processCheckout()
                          }
                        },
                        // Change label — compact 30px
                        { id:"change_due_label", view:"template", borderless:true, height:30,
                          template:'<div class="change-box"><span>Status Kembalian:</span><b>Rp 0</b></div>' },
                        // Quick cash — 2 rows of 3, 26px height
                        {
                          cols:[
                            { view:"button", value:"Uang Pas", height:26, css:"quick-cash-btn", click:()=>setQuickCash("pas") },
                            { view:"button", value:"50.000",   height:26, css:"quick-cash-btn", click:()=>setQuickCash(50000) },
                            { view:"button", value:"100.000",  height:26, css:"quick-cash-btn", click:()=>setQuickCash(100000) }
                          ]
                        },
                        {
                          cols:[
                            { view:"button", value:"200.000",  height:26, css:"quick-cash-btn", click:()=>setQuickCash(200000) },
                            { view:"button", value:"500.000",  height:26, css:"quick-cash-btn", click:()=>setQuickCash(500000) },
                            { view:"button", value:"1.000.000", height:26, css:"quick-cash-btn", click:()=>setQuickCash(1000000) }
                          ]
                        },
                        { height:4 },
                        { id:"btn_checkout", view:"button",
                          value:"💳 BAYAR & CETAK STRUK",
                          height:42, css:"pay-btn", click:processCheckout }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    });

    // Keyboard shortcuts (keep working but hidden from UI)
    window.addEventListener("keydown", e => {
      if (e.key === "F2") { e.preventDefault(); if ($$("search_input")) $$("search_input").focus(); }
      if (e.key === "F9") { e.preventDefault(); processCheckout(); }
    });

    startLiveClock(); checkHealth(); loadConfig(); loadCategories(); loadCatalog(); renderCart();

    // Auto open sales history if requested via query param (?history=1)
    if (new URLSearchParams(window.location.search).get("history") === "1") {
      setTimeout(() => showSalesHistory(), 300);
    }
  });
</script>
</body>
</html>
