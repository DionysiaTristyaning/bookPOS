<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookPOS - Master Data Buku & Inventaris</title>
  <!-- Webix UI Framework via CDN -->
  <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.min.css" type="text/css">
  <script src="https://cdn.webix.com/edge/webix.min.js" type="text/javascript"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
  <script src="/auth.js"></script>
  <script>
    let editingBookId = null;
    let categoriesList = [];

    // Format Rupiah Helper
    function formatRupiah(amount) {
      const num = parseInt(amount) || 0;
      return "Rp " + num.toLocaleString("id-ID");
    }

    // Normalisasi ISBN
    function cleanISBN(str) {
      return String(str || "").replace(/[^0-9X]/gi, "").toUpperCase();
    }

    // API Helper
    async function apiCall(endpoint, method = "GET", body = null) {
      const options = {
        method,
        headers: { "Content-Type": "application/json" }
      };
      if (body) options.body = JSON.stringify(body);
      try {
        const res = await fetch("/api" + endpoint, options);
        const data = await res.json();
        if (!res.ok) {
          const err = new Error(data.error || "Gagal (" + res.status + ")");
          err.data = data;
          throw err;
        }
        return data;
      } catch (err) {
        console.error("API Error (" + endpoint + "):", err);
        throw err;
      }
    }

    // Cek Health
    async function checkHealth() {
      try {
        const health = await apiCall("/health");
        const pill = $$("db_status_pill");
        if (pill) {
          if (health.database_connected) {
            pill.setHTML('<span class="status-pill status-online">● MongoDB Atlas Online</span>');
          } else {
            pill.setHTML('<span class="status-pill status-demo" title="' + (health.error || "Demo Mode") + '">⚡ Demo Mode (In-Memory)</span>');
          }
        }
      } catch (e) {
        const pill = $$("db_status_pill");
        if (pill) pill.setHTML('<span class="status-pill status-demo">⚠️ API Offline</span>');
      }
    }

    // Muat Kategori ke Options
    async function loadCategories() {
      try {
        categoriesList = await apiCall("/categories");

        // Update Filter Toolbar
        const filter = $$("filter_category");
        if (filter) {
          const opts = [{ id: "all", value: "Semua Kategori" }];
          categoriesList.forEach(c => opts.push({ id: c.id, value: c.nama }));
          filter.define("options", opts);
          filter.refresh();
        }

        // Update Form Modal
        const formCat = $$("form_kategori_id");
        if (formCat) {
          const formOpts = categoriesList.map(c => ({ id: c.id, value: c.nama }));
          formCat.define("options", formOpts);
          formCat.refresh();
        }
      } catch (err) {
        console.error("Gagal memuat kategori:", err);
      }
    }

    // Muat KPI Statistik
    async function loadStats() {
      try {
        const stats = await apiCall("/stats");
        if ($$("kpi_titles")) $$("kpi_titles").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Buku Aktif</div>' +
          '<div class="kpi-value">' + (stats.total_buku || 0) + ' Judul</div>' +
          '</div>'
        );
        if ($$("kpi_units")) $$("kpi_units").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Total Eksemplar</div>' +
          '<div class="kpi-value">' + (stats.total_eksemplar || 0) + ' Eks</div>' +
          '</div>'
        );
        if ($$("kpi_value")) $$("kpi_value").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Nilai Inventaris</div>' +
          '<div class="kpi-value" style="color:#059669; font-size:19px;">' + formatRupiah(stats.total_nilai_inventaris) + '</div>' +
          '</div>'
        );
        if ($$("kpi_low")) $$("kpi_low").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Stok Kritis (&le; 5)</div>' +
          '<div class="kpi-value" style="color:#d97706;">' + (stats.low_stock || 0) + ' Judul</div>' +
          '</div>'
        );
        if ($$("kpi_out")) $$("kpi_out").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Stok Habis (0)</div>' +
          '<div class="kpi-value" style="color:#dc2626;">' + (stats.out_of_stock || 0) + ' Judul</div>' +
          '</div>'
        );
        if ($$("kpi_archived")) $$("kpi_archived").setHTML(
          '<div class="kpi-card">' +
          '<div class="kpi-title">Nonaktif / Dihapus</div>' +
          '<div class="kpi-value" style="color:#64748b;">' + (stats.total_nonaktif || 0) + '</div>' +
          '</div>'
        );
      } catch (err) {
        console.error("Gagal memuat stats:", err);
      }
    }

    // Muat Tabel Master Buku
    async function loadBooks() {
      try {
        const search = $$("filter_search") ? $$("filter_search").getValue().trim() : "";
        const catId = $$("filter_category") ? $$("filter_category").getValue() : "all";
        const status = $$("filter_status") ? $$("filter_status").getValue() : "aktif";
        const stockStatus = $$("filter_stock") ? $$("filter_stock").getValue() : "all";

        let url = "/books?status=" + encodeURIComponent(status) + "&";
        if (search) url += "search=" + encodeURIComponent(search) + "&";
        if (catId && catId !== "all") url += "kategori_id=" + encodeURIComponent(catId) + "&";
        if (stockStatus && stockStatus !== "all") url += "stock_status=" + encodeURIComponent(stockStatus);

        const books = await apiCall(url);
        const table = $$("books_table");
        if (table) {
          table.clearAll();
          table.parse(books);
        }
        loadStats();
      } catch (err) {
        webix.message({ type: "error", text: "Gagal memuat data buku: " + err.message });
      }
    }

    // Seed Demo Data
    async function seedCatalog() {
      try {
        const res = await apiCall("/seed", "POST");
        webix.message({ type: "success", text: res.message });
        await loadCategories();
        await loadBooks();
      } catch (err) {
        webix.message({ type: "error", text: "Seed gagal: " + err.message });
      }
    }

    // Buka Modal Tambah Buku
    function openAddBookModal() {
      editingBookId = null;
      $$("book_modal_title").setValue("➕ Tambah Buku Baru");
      $$("book_form").clear();

      // Field stok hanya bisa diisi saat pertama kali input buku baru
      $$("form_stok").show();

      const defaultCat = categoriesList.length > 0 ? categoriesList[0].id : "";
      $$("book_form").setValues({
        kategori_id: defaultCat,
        harga_beli: 50000,
        harga_jual: 75000,
        stok: 10
      });
      $$("book_window").show();
    }

    // Buka Modal Edit Buku (Sesuai Aturan 70: STOK TIDAK BOLEH DITIMPA)
    function openEditBookModal(book) {
      editingBookId = book.id;
      $$("book_modal_title").setValue("✏️ Edit Buku: " + book.judul);

      // Sembunyikan field stok pada modal edit sesuai Aturan 70
      $$("form_stok").hide();

      $$("book_form").setValues({
        isbn: book.isbn,
        judul: book.judul,
        penulis: book.penulis,
        penerbit: book.penerbit || "",
        kategori_id: book.kategori_id,
        harga_beli: book.harga_beli,
        harga_jual: book.harga_jual
      });
      $$("book_window").show();
    }

    // Simpan Buku (Tambah / Update)
    async function saveBook() {
      const form = $$("book_form");
      if (!form.validate()) {
        webix.message({ type: "error", text: "Lengkapi semua field yang wajib diisi!" });
        return;
      }

      const values = form.getValues();
      values.isbn = cleanISBN(values.isbn);
      values.harga_beli = parseInt(values.harga_beli) || 0;
      values.harga_jual = parseInt(values.harga_jual) || 0;
      if (!editingBookId) {
        values.stok = parseInt(values.stok) || 0;
      }

      try {
        if (editingBookId) {
          await apiCall("/books/" + editingBookId, "PUT", values);
          webix.message({ type: "success", text: "Data buku berhasil diperbarui!" });
        } else {
          await apiCall("/books", "POST", values);
          webix.message({ type: "success", text: "Buku berhasil ditambahkan!" });
        }
        $$("book_window").close();
        loadBooks();
      } catch (err) {
        // Sesuai Aturan 67: Jika ISBN pernah dihapus, tawarkan opsi reaktivasi
        if (err.data && err.data.can_restore) {
          webix.confirm({
            title: "Buku Pernah Dinonaktifkan",
            text: err.data.error + '<br><br><b>Apakah Anda ingin mengaktifkan kembali buku "' + err.data.existing_judul + '"?</b>',
            ok: "Ya, Aktifkan Kembali",
            cancel: "Batal",
            callback: async function (res) {
              if (res) {
                await restoreBook(err.data.existing_id, err.data.existing_judul);
                $$("book_window").close();
              }
            }
          });
        } else {
          webix.message({ type: "error", text: err.message });
        }
      }
    }

    // Soft Delete Buku (Aturan 21, 58-68)
    function confirmSoftDeleteBook(book) {
      // Aturan 66: Peringatan khusus jika stok > 0
      let warningNote = "";
      if (book.stok > 0) {
        warningNote = '<br><br><span style="color:#d97706; font-weight:700;">⚠️ Perhatian: Buku ini masih memiliki sisa stok ' + book.stok + ' eksemplar.</span>';
      }

      webix.confirm({
        title: "Nonaktifkan Buku (Soft Delete)",
        text: 'Apakah Anda yakin ingin menonaktifkan buku "<b>' + book.judul + '</b>" (' + book.isbn + ')?' +
          warningNote +
          '<br><br><small style="color:#64748b;">Buku tidak akan dihapus permanen agar riwayat transaksi masa lalu tetap utuh. Buku dapat diaktifkan kembali sewaktu-waktu.</small>',
        ok: "Nonaktifkan",
        cancel: "Batal",
        type: "confirm-warning",
        callback: async function (result) {
          if (result) {
            try {
              const res = await apiCall("/books/" + book.id, "DELETE");
              webix.message({ type: "success", text: res.message });
              loadBooks();
            } catch (err) {
              webix.message({ type: "error", text: err.message });
            }
          }
        }
      });
    }

    // Aktifkan Kembali Buku (Aturan 67)
    async function restoreBook(bookId, judul) {
      try {
        await apiCall("/books/" + bookId + "/restore", "POST");
        webix.message({ type: "success", text: 'Buku "' + judul + '" berhasil diaktifkan kembali!' });
        loadBooks();
      } catch (err) {
        webix.message({ type: "error", text: "Gagal mengaktifkan: " + err.message });
      }
    }

    // Modal Penyesuaian Stok (Restock / Write-off)
    function openStockModal(book) {
      if ($$("stock_window")) $$("stock_window").destructor();

      webix.ui({
        view: "window",
        id: "stock_window",
        modal: true,
        position: "center",
        width: 400,
        head: {
          view: "toolbar",
          cols: [
            { view: "label", label: "📦 Penyesuaian Stok Eksemplar" },
            { view: "icon", icon: "wxi-close", click: () => $$("stock_window").close() }
          ]
        },
        body: {
          view: "form",
          id: "stock_form",
          elements: [
            {
              template:
                '<div style="font-size:13px; line-height:1.4; padding:4px 0;">' +
                '<b>' + book.judul + '</b><br>' +
                '<span style="color:#64748b;">ISBN: ' + book.isbn + ' • Stok Saat Ini: <b style="color:#0f172a;">' + book.stok + ' eksemplar</b></span>' +
                '</div>',
              autoheight: true,
              borderless: true
            },
            { height: 8 },
            {
              view: "radio",
              id: "adj_direction",
              value: "add",
              options: [
                { id: "add", value: "➕ Tambah Stok (Restock / Pengadaan Baru)" },
                { id: "deduct", value: "➖ Kurangi Stok (Rusak / Hilang / Retur)" }
              ]
            },
            {
              view: "text",
              id: "adj_qty",
              label: "Jumlah:",
              labelWidth: 100,
              value: "5",
              validate: webix.rules.isNumber
            },
            {
              view: "text",
              id: "adj_alasan",
              label: "Keterangan:",
              labelWidth: 100,
              placeholder: "e.g. Pembelian dari Penerbit"
            },
            { height: 6 },
            {
              cols: [
                {
                  view: "button",
                  value: "Simpan Stok",
                  css: "webix_primary",
                  click: async function () {
                    const qtyVal = parseInt($$("adj_qty").getValue()) || 0;
                    if (qtyVal <= 0) {
                      webix.message({ type: "error", text: "Jumlah harus berupa angka positif" });
                      return;
                    }
                    const dir = $$("adj_direction").getValue();
                    const delta = dir === "add" ? qtyVal : -qtyVal;
                    const alasan = $$("adj_alasan").getValue();

                    try {
                      await apiCall("/books/adjust-stock", "POST", {
                        id: book.id,
                        delta: delta,
                        alasan: alasan || (dir === "add" ? "Restock" : "Pengurangan")
                      });
                      webix.message({ type: "success", text: "Stok berhasil disesuaikan!" });
                      $$("stock_window").close();
                      loadBooks();
                    } catch (err) {
                      webix.message({ type: "error", text: err.message });
                    }
                  }
                },
                {
                  view: "button",
                  value: "Batal",
                  click: () => $$("stock_window").close()
                }
              ]
            }
          ]
        }
      }).show();
    }

    // ----------------- MODAL KELOLA KATEGORI (MODUL 2) -----------------
    async function openManageCategoriesModal() {
      if ($$("categories_window")) $$("categories_window").destructor();

      const cats = await apiCall("/categories");

      webix.ui({
        view: "window",
        id: "categories_window",
        modal: true,
        position: "center",
        width: 600,
        height: 480,
        head: {
          view: "toolbar",
          cols: [
            { view: "label", label: "📂 Kelola Master Kategori (Koleksi: categories)" },
            { view: "icon", icon: "wxi-close", click: () => $$("categories_window").close() }
          ]
        },
        body: {
          rows: [
            // Form Input Kategori Baru
            {
              view: "form",
              id: "new_cat_form",
              padding: 10,
              cols: [
                { view: "text", id: "new_cat_nama", placeholder: "Nama Kategori Baru (e.g. Komik, Sains)" },
                { width: 8 },
                {
                  view: "button",
                  value: "+ Tambah Kategori",
                  autowidth: true,
                  css: "webix_primary",
                  click: async function () {
                    const nama = $$("new_cat_nama").getValue().trim();
                    if (!nama) {
                      webix.message({ type: "error", text: "Nama kategori wajib diisi" });
                      return;
                    }
                    try {
                      await apiCall("/categories", "POST", { nama });
                      webix.message({ type: "success", text: "Kategori berhasil ditambahkan!" });
                      $$("new_cat_nama").setValue("");
                      const refreshed = await apiCall("/categories");
                      $$("cat_datatable").clearAll();
                      $$("cat_datatable").parse(refreshed);
                      loadCategories();
                    } catch (err) {
                      webix.message({ type: "error", text: err.message });
                    }
                  }
                }
              ]
            },
            // Tabel Kategori
            {
              view: "datatable",
              id: "cat_datatable",
              data: cats,
              columns: [
                { id: "nama", header: "Nama Kategori", fillspace: true },
                { id: "slug", header: "Slug (Unik)", width: 140, css: "isbn-text" },
                {
                  id: "total_buku",
                  header: "Dirujuk Buku",
                  width: 120,
                  template: obj => '<span class="category-tag">' + (obj.total_buku || 0) + ' judul</span>'
                },
                {
                  id: "actions",
                  header: "Hapus",
                  width: 80,
                  template: () => '<span class="action-btn del cat-del-btn" title="Hapus Kategori">🗑️</span>'
                }
              ],
              onClick: {
                "cat-del-btn": function (e, id) {
                  const cat = this.getItem(id);
                  // Aturan 93: Cek sebelum hapus
                  webix.confirm({
                    title: "Hapus Kategori",
                    text: 'Hapus kategori "<b>' + cat.nama + '</b>"?<br><br><small style="color:#64748b;">Kategori dilarang dihapus jika masih dirujuk oleh buku apa pun (termasuk buku nonaktif).</small>',
                    ok: "Hapus",
                    cancel: "Batal",
                    type: "confirm-error",
                    callback: async function (res) {
                      if (res) {
                        try {
                          await apiCall("/categories/" + cat.id, "DELETE");
                          webix.message({ type: "success", text: "Kategori berhasil dihapus" });
                          const refreshed = await apiCall("/categories");
                          $$("cat_datatable").clearAll();
                          $$("cat_datatable").parse(refreshed);
                          loadCategories();
                          loadBooks();
                        } catch (err) {
                          webix.message({ type: "error", text: err.message });
                        }
                      }
                    }
                  });
                  return false;
                }
              }
            }
          ]
        }
      }).show();
    }

    // ----------------- MODAL KELOLA USER (MODUL 3) -----------------
    async function openManageUsersModal() {
      if ($$("users_window")) $$("users_window").destructor();

      const users = await apiCall("/users");

      webix.ui({
        view: "window",
        id: "users_window",
        modal: true,
        position: "center",
        width: 680,
        height: 520,
        head: {
          view: "toolbar",
          cols: [
            { view: "label", label: "👥 Kelola Pegawai & Hak Akses (Koleksi: users)" },
            { view: "icon", icon: "wxi-close", click: () => $$("users_window").close() }
          ]
        },
        body: {
          rows: [
            // Form Tambah User
            {
              view: "form",
              id: "new_user_form",
              padding: 10,
              cols: [
                { view: "text", id: "u_nama", placeholder: "Nama Pegawai" },
                { view: "text", id: "u_username", placeholder: "Username (unik)", width: 140 },
                { view: "text", id: "u_password", placeholder: "Password (min 6)", type: "password", width: 140 },
                {
                  view: "select",
                  id: "u_role",
                  width: 100,
                  value: "kasir",
                  options: [
                    { id: "kasir", value: "Kasir" },
                    { id: "admin", value: "Admin" }
                  ]
                },
                {
                  view: "button",
                  value: "+ Tambah",
                  autowidth: true,
                  css: "webix_primary",
                  click: async function () {
                    const nama = $$("u_nama").getValue().trim();
                    const username = $$("u_username").getValue().trim();
                    const password = $$("u_password").getValue().trim();
                    const role = $$("u_role").getValue();

                    if (!nama || !username || !password) {
                      webix.message({ type: "error", text: "Semua field user wajib diisi" });
                      return;
                    }

                    try {
                      await apiCall("/users", "POST", { nama, username, password, role });
                      webix.message({ type: "success", text: "Pegawai baru berhasil didaftarkan!" });
                      $$("u_nama").setValue("");
                      $$("u_username").setValue("");
                      $$("u_password").setValue("");
                      const refreshed = await apiCall("/users");
                      $$("user_datatable").clearAll();
                      $$("user_datatable").parse(refreshed);
                    } catch (err) {
                      webix.message({ type: "error", text: err.message });
                    }
                  }
                }
              ]
            },
            // Tabel User
            {
              view: "datatable",
              id: "user_datatable",
              data: users,
              columns: [
                { id: "nama", header: "Nama Pegawai", fillspace: true },
                { id: "username", header: "Username", width: 130, css: "isbn-text" },
                {
                  id: "role",
                  header: "Role",
                  width: 100,
                  template: obj => '<span class="category-tag" style="text-transform:uppercase;">' + obj.role + '</span>'
                },
                {
                  id: "aktif",
                  header: "Status Akun",
                  width: 120,
                  template: obj => obj.aktif ?
                    '<span class="status-aktif-badge">● Aktif</span>' :
                    '<span class="status-nonaktif-badge">Dinonaktifkan</span>'
                },
                {
                  id: "toggle",
                  header: "Aksi Pegawai",
                  width: 130,
                  template: obj => obj.aktif ?
                    '<button class="action-btn del user-toggle-btn" style="font-size:11px;">Nonaktifkan</button>' :
                    '<button class="action-btn restore user-toggle-btn" style="font-size:11px;">Aktifkan</button>'
                }
              ],
              onClick: {
                "user-toggle-btn": async function (e, id) {
                  const u = this.getItem(id);
                  try {
                    await apiCall("/users/" + u.id + "/toggle-active", "POST");
                    webix.message({ type: "success", text: "Status pegawai berhasil diubah" });
                    const refreshed = await apiCall("/users");
                    $$("user_datatable").clearAll();
                    $$("user_datatable").parse(refreshed);
                  } catch (err) {
                    webix.message({ type: "error", text: err.message });
                  }
                  return false;
                }
              }
            }
          ]
        }
      }).show();
    }

    // ----------------- WEBIX UI READY -----------------
    webix.ready(function () {
      webix.ui({
        id: "master_layout",
        rows: [
          // Top Navigation Header
          {
            view: "toolbar",
            height: 54,
            css: "app-header",
            cols: [
              {
                view: "label",
                autowidth: true,
                label: '<span class="brand-title">📚 BookPOS <span class="brand-badge">MVP</span></span>'
              },
              { width: 15 },
              {
                view: "button",
                value: "🛒 Kasir (POS)",
                css: "nav-btn",
                autowidth: true,
                click: () => window.location.href = "index.html"
              },
              {
                view: "button",
                value: "📦 Master Data Buku",
                css: "nav-btn active",
                autowidth: true
              },
              {},
              {
                id: "db_status_pill",
                view: "template",
                borderless: true,
                width: 220,
                template: '<span class="status-pill status-demo">Mengecek DB...</span>'
              },
              {
                view: "button",
                value: "📂 Kelola Kategori",
                autowidth: true,
                click: openManageCategoriesModal
              },
              { width: 4 },
              {
                view: "button",
                value: "👥 Kelola Pegawai",
                autowidth: true,
                click: openManageUsersModal
              },
              { width: 4 },
              {
                view: "button",
                value: "⚡ Seed Data",
                autowidth: true,
                click: seedCatalog
              },
              { width: 6 },
              {
                view: "button",
                value: "+ Tambah Buku Baru",
                autowidth: true,
                css: "webix_primary",
                click: openAddBookModal
              }
            ]
          },

          // Header Kartu KPI Statistik
          {
            height: 85,
            padding: { top: 6, bottom: 4, left: 10, right: 10 },
            cols: [
              { id: "kpi_titles", view: "template", borderless: true, template: "" },
              { width: 8 },
              { id: "kpi_units", view: "template", borderless: true, template: "" },
              { width: 8 },
              { id: "kpi_value", view: "template", borderless: true, template: "" },
              { width: 8 },
              { id: "kpi_low", view: "template", borderless: true, template: "" },
              { width: 8 },
              { id: "kpi_out", view: "template", borderless: true, template: "" },
              { width: 8 },
              { id: "kpi_archived", view: "template", borderless: true, template: "" }
            ]
          },

          // Toolbar Pencarian & Filter
          {
            view: "toolbar",
            padding: 8,
            cols: [
              {
                view: "text",
                id: "filter_search",
                placeholder: "🔍 Cari Judul, Penulis, Penerbit, atau ISBN...",
                width: 320,
                on: {
                  onTimedKeyPress: () => loadBooks(),
                  onEnter: () => loadBooks()
                }
              },
              { width: 6 },
              {
                view: "select",
                id: "filter_category",
                width: 170,
                options: [{ id: "all", value: "Semua Kategori" }],
                on: { onChange: () => loadBooks() }
              },
              { width: 6 },
              {
                view: "select",
                id: "filter_status",
                width: 160,
                value: "aktif",
                options: [
                  { id: "aktif", value: "✅ Buku Aktif (Default)" },
                  { id: "nonaktif", value: "🗑️ Nonaktif / Dihapus" },
                  { id: "semua", value: "Semua Status Buku" }
                ],
                on: { onChange: () => loadBooks() }
              },
              { width: 6 },
              {
                view: "select",
                id: "filter_stock",
                width: 150,
                options: [
                  { id: "all", value: "Semua Stok" },
                  { id: "low", value: "⚠️ Stok Kritis (≤ 5)" },
                  { id: "out", value: "🚫 Stok Habis (0)" },
                  { id: "in", value: "Tersedia (> 0)" }
                ],
                on: { onChange: () => loadBooks() }
              },
              {},
              {
                view: "button",
                value: "🔄 Segarkan",
                width: 100,
                click: () => loadBooks()
              }
            ]
          },

          // Tabel Master Buku
          {
            view: "datatable",
            id: "books_table",
            select: "row",
            rowHeight: 46,
            columns: [
              {
                id: "isbn",
                header: "ISBN (Barcode)",
                width: 145,
                template: obj => '<span class="isbn-text">' + obj.isbn + '</span>'
              },
              {
                id: "judul",
                header: "Judul Buku & Penulis",
                fillspace: 2,
                template: obj =>
                  '<div style="line-height:1.2; padding:4px 0;">' +
                  '<div style="font-weight:700; color:#0f172a;">' + obj.judul + '</div>' +
                  '<div style="font-size:11px; color:#64748b;">oleh ' + obj.penulis + (obj.penerbit ? ' • ' + obj.penerbit : '') + '</div>' +
                  '</div>'
              },
              {
                id: "kategori_nama",
                header: "Kategori",
                width: 125,
                template: obj => '<span class="category-tag">' + (obj.kategori_nama || "-") + '</span>'
              },
              {
                id: "harga_beli",
                header: "Harga Beli",
                width: 110,
                template: obj => '<span style="color:#64748b; font-family:monospace;">' + formatRupiah(obj.harga_beli) + '</span>'
              },
              {
                id: "harga_jual",
                header: "Harga Jual",
                width: 115,
                template: obj => '<span class="price-text">' + formatRupiah(obj.harga_jual) + '</span>'
              },
              {
                id: "margin",
                header: "Margin %",
                width: 85,
                template: obj => {
                  const j = Number(obj.harga_jual || 0);
                  const b = Number(obj.harga_beli || 0);
                  if (j <= 0) return "0.0%";
                  const margin = ((j - b) / j * 100).toFixed(1);
                  return '<span style="font-weight:600; color:' + (margin >= 25 ? '#059669' : '#d97706') + ';">' + margin + '%</span>';
                }
              },
              {
                id: "stok",
                header: "Stok",
                width: 110,
                template: obj => {
                  if (obj.stok <= 0) return '<span class="stock-badge stock-out">Habis</span>';
                  if (obj.stok <= 5) return '<span class="stock-badge stock-low">' + obj.stok + ' Eks</span>';
                  return '<span class="stock-badge stock-in">' + obj.stok + ' Eks</span>';
                }
              },
              {
                id: "aktif",
                header: "Status",
                width: 105,
                template: obj => obj.aktif ?
                  '<span class="status-aktif-badge">● Aktif</span>' :
                  '<span class="status-nonaktif-badge">Nonaktif</span>'
              },
              {
                id: "actions",
                header: "Aksi",
                width: 135,
                template: obj => {
                  if (!obj.aktif) {
                    return '<span class="action-btn restore restore-btn" title="Aktifkan Kembali">↩️ Aktifkan</span>';
                  }
                  return '<div style="display:flex; gap:4px;">' +
                    '<span class="action-btn edit-btn" title="Edit Data Buku">✏️</span>' +
                    '<span class="action-btn stock-btn" title="Sesuaikan Stok">📦</span>' +
                    '<span class="action-btn del delete-btn" title="Nonaktifkan (Soft Delete)">🗑️</span>' +
                    '</div>';
                }
              }
            ],
            onClick: {
              "edit-btn": function (e, id) {
                const row = this.getItem(id);
                openEditBookModal(row);
                return false;
              },
              "stock-btn": function (e, id) {
                const row = this.getItem(id);
                openStockModal(row);
                return false;
              },
              "delete-btn": function (e, id) {
                const row = this.getItem(id);
                confirmSoftDeleteBook(row);
                return false;
              },
              "restore-btn": function (e, id) {
                const row = this.getItem(id);
                restoreBook(row.id, row.judul);
                return false;
              }
            }
          }
        ]
      });

      // Modal: Tambah / Edit Buku Window
      webix.ui({
        view: "window",
        id: "book_window",
        modal: true,
        position: "center",
        width: 480,
        head: {
          view: "toolbar",
          cols: [
            { id: "book_modal_title", view: "label", label: "Tambah Buku Baru" },
            { view: "icon", icon: "wxi-close", click: () => $$("book_window").close() }
          ]
        },
        body: {
          view: "form",
          id: "book_form",
          rules: {
            isbn: webix.rules.isNotEmpty,
            judul: webix.rules.isNotEmpty,
            penulis: webix.rules.isNotEmpty,
            kategori_id: webix.rules.isNotEmpty,
            harga_beli: webix.rules.isNumber,
            harga_jual: webix.rules.isNumber
          },
          elements: [
            { view: "text", name: "isbn", label: "ISBN-13:", labelWidth: 120, placeholder: "e.g. 9786020000001 (tanpa spasi/strip)", required: true },
            { view: "text", name: "judul", label: "Judul Buku:", labelWidth: 120, placeholder: "e.g. Laskar Pelangi", required: true },
            { view: "text", name: "penulis", label: "Penulis:", labelWidth: 120, placeholder: "e.g. Andrea Hirata", required: true },
            { view: "text", name: "penerbit", label: "Penerbit:", labelWidth: 120, placeholder: "e.g. Bentang Pustaka" },
            {
              view: "select",
              id: "form_kategori_id",
              name: "kategori_id",
              label: "Kategori:",
              labelWidth: 120,
              options: [],
              required: true
            },
            { view: "text", name: "harga_beli", label: "Harga Beli (Rp):", labelWidth: 120, placeholder: "e.g. 60000", required: true },
            { view: "text", name: "harga_jual", label: "Harga Jual (Rp):", labelWidth: 120, placeholder: "e.g. 85000", required: true },
            {
              id: "form_stok",
              view: "text",
              name: "stok",
              label: "Stok Awal:",
              labelWidth: 120,
              placeholder: "e.g. 24",
              value: "10"
            },
            { height: 10 },
            {
              cols: [
                { view: "button", value: "Simpan Buku", css: "webix_primary", click: saveBook },
                { view: "button", value: "Batal", click: () => $$("book_window").close() }
              ]
            }
          ]
        }
      });

      // Init Data
      checkHealth();
      loadCategories();
      loadBooks();
    });
  </script>
</body>

</html>
